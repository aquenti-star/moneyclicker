<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Clicker App</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'PT Mono', monospace;
        }

        body {
            background-color: #0d0d12;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #16161e;
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 11px;
            color: #8888a0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-val {
            font-size: 36px;
            font-weight: bold;
            color: #ffca28;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #16161e;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            color: #fff;
            margin-top: 5px;
        }

        #ad-btn {
            background: transparent;
            color: #a29bfe;
            border: 1px solid #a29bfe;
            border-radius: 18px;
            padding: 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        #ad-btn:active {
            background: rgba(162, 155, 254, 0.1);
            transform: scale(0.98);
        }

        #ad-btn:disabled {
            border-color: #444;
            color: #555;
            cursor: not-allowed;
            transform: none;
        }

        .status-text {
            font-size: 10px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Баланс -->
        <div class="card">
            <div class="card-title">Текущий баланс</div>
            <div id="balance" class="balance-val">0 ⭐</div>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="card-title">Просмотров всего</div>
                <div id="total-views" class="stat-val">0</div>
            </div>
            <div class="stat-card">
                <div class="card-title">За сегодня</div>
                <div id="today-views" class="stat-val">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Заработано с рекламы за всё время</div>
            <div id="total-earned" class="stat-val" style="color: #ffca28;">0 ⭐</div>
        </div>

        <!-- Кнопка -->
        <button id="ad-btn" onclick="startAd()">СМОТРЕТЬ РЕКЛАМУ</button>
        <div id="status" class="status-text">Готов к запуску</div>
    </div>

    <script>
        const AdController = window.Adsgram.init({ blockId: "29401" });

        // Данные
        let balance = Number(localStorage.getItem('user_balance')) || 0;
        let totalViews = Number(localStorage.getItem('total_views')) || 0;
        let totalEarned = Number(localStorage.getItem('total_earned')) || 0;
        
        // Проверка сброса дневных просмотров
        const todayKey = 'today_views_' + new Date().toISOString().slice(0, 10);
        let todayViews = Number(localStorage.getItem(todayKey)) || 0;

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString() + ' ⭐';
            document.getElementById('total-views').innerText = totalViews;
            document.getElementById('today-views').innerText = todayViews;
            document.getElementById('total-earned').innerText = totalEarned.toLocaleString() + ' ⭐';
        }

        updateUI();

        function startAd() {
            const btn = document.getElementById('ad-btn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = "ЗАГРУЗКА...";
            status.innerText = "Запрос рекламного блока...";

            AdController.show().then((result) => {
                if (result.done) {
                    balance += 1000;
                    totalViews += 1;
                    todayViews += 1;
                    totalEarned += 1000;

                    localStorage.setItem('user_balance', balance);
                    localStorage.setItem('total_views', totalViews);
                    localStorage.setItem(todayKey, todayViews);
                    localStorage.setItem('total_earned', totalEarned);

                    updateUI();
                    status.innerText = "Успешно! +1000 ⭐";
                } else {
                    status.innerText = "Реклама была закрыта";
                }
            }).catch((err) => {
                console.error(err);
                status.innerText = "Ошибка загрузки рекламы";
            }).finally(() => {
                runCooldown(10);
            });
        }

        function runCooldown(sec) {
            const btn = document.getElementById('ad-btn');
            const status = document.getElementById('status');
            let left = sec;

            const timer = setInterval(() => {
                btn.innerText = `ПАУЗА (${left}с)`;
                left--;

                if (left < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "СМОТРЕТЬ РЕКЛАМУ";
                    status.innerText = "Готов к запуску";
                }
            }, 1000);
        }
    </script>
</body>
</html>
