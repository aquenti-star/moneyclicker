<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruby Quiz</title>
    <!-- Подключаем шрифт Unbounded Bold / Montserrat для крутого стиля -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Официальный скрипт Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background-color: #0b0910;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }
        /* Счетчики рекламы в углу */
        .ad-counter-badge {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: right;
        }
        
        .header {
            text-align: center;
            margin-top: 25px;
            width: 100%;
            position: relative;
        }
        .title {
            font-family: 'Unbounded', sans-serif;
            font-size: 18px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ff3366, #ff6b8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .balance-card {
            background: linear-gradient(145deg, #151120, #0f0c17);
            border: 1px solid rgba(255, 51, 102, 0.2);
            border-radius: 16px;
            padding: 12px 20px;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.1);
        }
        .balance-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 22px;
            color: #fff;
        }
        .balance-usd {
            font-size: 12px;
            color: #8c859b;
            margin-top: 2px;
        }

        /* Навигация по режимам */
        .modes-nav {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 380px;
            margin: 15px 0;
        }
        .mode-btn {
            flex: 1;
            background: #14101f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8c859b;
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #ff3366, #e60039);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        /* Игровая зона */
        .game-container {
            background: #120e1b;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto 0;
        }
        .question-box {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e1dcf6;
            line-height: 1.4;
        }
        .flag-display {
            font-size: 55px;
            margin-bottom: 10px;
        }

        /* Варианты ответов */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .answer-btn {
            background: #1c162b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .answer-btn:active {
            transform: scale(0.96);
            background: #ff3366;
            border-color: #ff3366;
        }

        /* Кнопка выводанизу */
        .footer-action {
            width: 100%;
            max-width: 380px;
            margin-top: 15px;
        }
        .withdraw-btn {
            width: 100%;
            background: linear-gradient(135deg, #1c1729, #14101f);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: #ff3366;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .withdraw-btn:active {
            background: #ff3366;
            color: #fff;
        }

        /* Модальное окно вывода */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: #14101f;
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .modal-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .modal-input {
            width: 100%;
            background: #0b0910;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        .modal-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff3366, #e60039);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .close-modal {
            margin-top: 10px;
            background: transparent;
            border: none;
            color: #8c859b;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Счетчик просмотров рекламы в углу -->
    <div class="ad-counter-badge" id="adCounterBadge">
        Сегодня: 0<br>Всего: 0
    </div>

    <div class="header">
        <div class="title">Ruby Quiz</div>
        <div class="balance-card">
            <div class="balance-value" id="balanceVal">0 💎</div>
            <div class="balance-usd" id="usdVal">≈ $0.00</div>
        </div>
    </div>

    <!-- Переключатель мини-игр -->
    <div class="modes-nav">
        <button class="mode-btn active" onclick="switchMode('quiz')">Викторина</button>
        <button class="mode-btn" onclick="switchMode('math')">Математика</button>
        <button class="mode-btn" onclick="switchMode('countries')">Страны</button>
    </div>

    <!-- Игровая карточка -->
    <div class="game-container">
        <div id="gameExtraVisual"></div>
        <div class="question-box" id="questionText">Загрузка игры...</div>
        <div class="answers-grid" id="answersGrid"></div>
    </div>

    <!-- Кнопка вывода -->
    <div class="footer-action">
        <button class="withdraw-btn" id="withdrawBtn" onclick="openWithdrawModal()">Вывод средств</button>
    </div>

    <!-- Модальное окно вывода -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <div class="modal-title">Вывод рубинов</div>
            <p style="font-size: 12px; color: #8c859b; margin-bottom: 15px;">Мин. сумма: 10 000 монет ($1.00)</p>
            <input type="text" class="modal-input" id="walletInput" placeholder="Введите ваш USDT кошелек (TON/TRC20)">
            <button class="modal-btn" onclick="submitWithdraw()">Создать заявку</button>
            <br>
            <button class="close-modal" onclick="closeWithdrawModal()">Отмена</button>
        </div>
    </div>

    <script>
        // Инициализация Adsgram Controller (Block ID твой прежний)
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "29401" }) : null;

        // Данные игрока
        let state = {
            balance: parseInt(localStorage.getItem('rq_balance')) || 0,
            adsToday: parseInt(localStorage.getItem('rq_ads_today')) || 0,
            adsTotal: parseInt(localStorage.getItem('rq_ads_total')) || 0,
            lastDay: localStorage.getItem('rq_last_day') || new Date().toDateString(),
            actionsWithoutAd: 0,
            nextAdTrigger: Math.floor(Math.random() * 3) + 3, // от 3 до 5 ответов до рекламы
            cooldownUntil: parseInt(localStorage.getItem('rq_cooldown')) || 0
        };

        // Проверка смены дня для счетчика
        if (state.lastDay !== new Date().toDateString()) {
            state.adsToday = 0;
            state.lastDay = new Date().toDateString();
            localStorage.setItem('rq_last_day', state.lastDay);
            localStorage.setItem('rq_ads_today', 0);
        }

        let currentMode = 'quiz';
        let currentProblem = null;

        // Базы данных для игр
        const quizBase = [
            { q: "Какая планета ближе всего к Солнцу?", answers: ["Меркурий", "Венера", "Марс", "Земля"], correct: "Меркурий" },
            { q: "Сколько бит в одном килобайте?", answers: ["8192", "1024", "1000", "4096"], correct: "8192" },
            { q: "В каком году вышел первый iPhone?", answers: ["2007", "2005", "2009", "2010"], correct: "2007" },
            { q: "Какая химическая формула воды?", answers: ["H2O", "CO2", "O2", "CH4"], correct: "H2O" },
            { q: "Сколько континентов на Земле?", answers: ["6", "5", "7", "4"], correct: "6" }
        ];

        const countriesBase = [
            { flag: "🇷🇺", name: "Россия", answers: ["Россия", "Украина", "Беларусь", "Казахстан"], correct: "Россия" },
            { flag: "🇺🇸", name: "США", answers: ["Канада", "США", "Великобритания", "Австралия"], correct: "США" },
            { flag: "🇯🇵", name: "Япония", answers: ["Китай", "Южная Корея", "Япония", "Вьетнам"], correct: "Япония" },
            { flag: "🇩🇪", name: "Германия", answers: ["Франция", "Германия", "Италия", "Польша"], correct: "Германия" },
            { flag: "🇫🇷", name: "Франция", answers: ["Испания", "Германия", "Франция", "Италия"], correct: "Франция" }
        ];

        function updateUI() {
            document.getElementById('balanceVal').innerText = state.balance.toLocaleString() + ' 💎';
            let usd = (state.balance / 10000).toFixed(2);
            document.getElementById('usdVal').innerText = `≈ $${usd}`;
            document.getElementById('adCounterBadge').innerHTML = `Сегодня: ${state.adsToday}<br>Всего: ${state.adsTotal}`;
            
            localStorage.setItem('rq_balance', state.balance);
            localStorage.setItem('rq_ads_today', state.adsToday);
            localStorage.setItem('rq_ads_total', state.adsTotal);
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            generateNewTask();
        }

        function generateNewTask() {
            document.getElementById('gameExtraVisual').innerHTML = '';
            if (currentMode === 'quiz') {
                let item = quizBase[Math.floor(Math.random() * quizBase.length)];
                currentProblem = { text: item.q, answers: [...item.answers].sort(() => Math.random() - 0.5), correct: item.correct, reward: 10 };
            } else if (currentMode === 'countries') {
                let item = countriesBase[Math.floor(Math.random() * countriesBase.length)];
                document.getElementById('gameExtraVisual').innerHTML = `<div class="flag-display">${item.flag}</div>`;
                currentProblem = { text: "Какая это страна?", answers: [...item.answers].sort(() => Math.random() - 0.5), correct: item.correct, reward: 5 };
            } else if (currentMode === 'math') {
                currentProblem = generateMathTask();
            }
            renderTask();
        }

        function generateMathTask() {
            const ops = ['+', '-', '*'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let n1, n2, ans;
            if (op === '+') { n1 = rnd(5, 30); n2 = rnd(2, 20); ans = n1 + n2; }
            else if (op === '-') { n1 = rnd(15, 45); n2 = rnd(1, n1); ans = n1 - n2; }
            else { n1 = rnd(2, 9); n2 = rnd(2, 9); ans = n1 * n2; }

            let answers = [ans];
            let offsets = [-3, -2, -1, 1, 2, 3].sort(() => Math.random() - 0.5);
            for (let off of offsets) {
                let w = ans + off;
                if (w >= 0 && !answers.includes(w) && answers.length < 4) answers.push(w);
            }
            answers.sort(() => Math.random() - 0.5);
            return { text: `${n1} ${op} ${n2} = ?`, answers: answers, correct: ans, reward: 5 };
        }

        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function renderTask() {
            document.getElementById('questionText').innerText = currentProblem.text;
            let grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            currentProblem.answers.forEach(ans => {
                let btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(ans);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected == currentProblem.correct) {
                state.balance += currentProblem.reward;
            }
            updateUI();
            
            // Проверка на рекламу и кулдаун
            state.actionsWithoutAd++;
            if (state.actionsWithoutAd >= state.nextAdTrigger) {
                checkAndShowAd();
                state.actionsWithoutAd = 0;
                state.nextAdTrigger = Math.floor(Math.random() * 3) + 3;
            }
            generateNewTask();
        }

        // Проверка кулдауна и показ рекламы
        function checkAndShowAd() {
            let now = Date.now();
            if (now < state.cooldownUntil) {
                return; // Кулдаун еще идет (30-40 сек)
            }

            if (adController) {
                adController.show().then((result) => {
                    state.adsToday++;
                    state.adsTotal++;
                    // Устанавливаем кулдаун 35 секунд
                    state.cooldownUntil = Date.now() + 35000;
                    localStorage.setItem('rq_cooldown', state.cooldownUntil);
                    updateUI();
                }).catch((e) => {
                    console.log("Ad error or skipped", e);
                });
            }
        }

        // Модальное окно вывода
        function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
        function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }
        
        function submitWithdraw() {
            let wallet = document.getElementById('walletInput').value.trim();
            if (wallet.length < 6) { alert('Введите корректный кошелек!'); return; }
            if (state.balance < 10000) { alert('Недостаточно рубинов для вывода (мин. 10 000)'); return; }

            // Диплинк в твоего бота для выводов
            let withdrawUrl = `https://t.me/rubyminerwithdraw_bot?start=withdraw_${encodeURIComponent(wallet)}_${state.balance}`;
            window.location.href = withdrawUrl;
        }

        // Старт игры при загрузке
        updateUI();
        generateNewTask();
    </script>
</body>
</html>
