<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ruby Miner</title>
    <!-- Подключаем шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Скрипт AdsGram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #08080a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Шапка с балансом */
        .balance-card {
            background: linear-gradient(135deg, #141013 0%, #1c0c10 100%);
            border: 1px solid rgba(255, 30, 66, 0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(255, 30, 66, 0.08);
        }

        .card-title {
            font-size: 11px;
            color: #a0888c;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .balance-val {
            font-size: 36px;
            font-weight: 800;
            color: #ff2a4d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(255, 42, 77, 0.3);
        }

        .ruble-eq {
            font-size: 12px;
            color: #706065;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Зона кликера с рубином */
        .miner-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            position: relative;
        }

        .ruby-btn {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ff2a4d 0%, #8b0000 70%, #4a0000 100%);
            border-radius: 50%;
            border: 4px solid rgba(255, 100, 120, 0.4);
            box-shadow: 0 0 40px rgba(255, 42, 77, 0.3), inset 0 -8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            position: relative;
        }

        .ruby-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(255, 42, 77, 0.5);
        }

        .progress-container {
            width: 100%;
            background: #161214;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ff2a4d);
            width: 0%;
            transition: width 0.2s ease;
        }

        .click-counter-text {
            font-size: 11px;
            color: #887075;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Меню кнопок (Задания и Вывод) */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background: #141013;
            border: 1px solid rgba(255, 30, 66, 0.2);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .action-btn:active {
            background: rgba(255, 30, 66, 0.15);
            transform: scale(0.97);
        }

        /* Кнопка вывода во всю ширину */
        .withdraw-btn {
            background: linear-gradient(135deg, #cc0029 0%, #ff2a4d 100%);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 77, 0.3);
            transition: 0.2s;
            text-align: center;
        }

        .withdraw-btn:active {
            transform: scale(0.97);
        }

        .withdraw-btn:disabled {
            background: #1c1416;
            color: #554448;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Модальные окна / Блоки */
        .section-box {
            background: #120e11;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
        }

        .section-header {
            font-size: 12px;
            font-weight: 700;
            color: #c0a8ad;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1317;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 30, 66, 0.1);
        }

        .task-info div:first-child {
            font-size: 12px;
            font-weight: 700;
        }

        .task-info div:last-child {
            font-size: 10px;
            color: #ff2a4d;
            font-weight: 600;
            margin-top: 2px;
        }

        .task-go-btn {
            background: #ff2a4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .task-go-btn.done {
            background: #241c20;
            color: #66555a;
            cursor: not-allowed;
        }

        .status-text {
            font-size: 11px;
            font-weight: 600;
            color: #706065;
            text-align: center;
            min-height: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Баланс -->
        <div class="balance-card">
            <div class="card-title">Баланс рубинов</div>
            <div class="balance-val">
                <span>💎</span>
                <span id="balance">0</span>
            </div>
            <div class="ruble-eq" id="usd-eq">≈ $0.0000</div>
        </div>

        <!-- Зона кликера с рубином -->
        <div class="miner-area">
            <div class="ruby-btn" onclick="tapRuby()">💎</div>
            <div style="width: 100%;">
                <div class="progress-container">
                    <div id="ad-progress" class="progress-bar"></div>
                </div>
                <div id="click-status" class="click-counter-text" style="text-align: center;">До рекламы: 30 / 30</div>
            </div>
        </div>

        <!-- Статус бар -->
        <div id="status" class="status-text">Готов к майнингу</div>

        <!-- Кнопка вывода -->
        <button id="withdraw-btn" class="withdraw-btn" onclick="openWithdrawModal()" disabled>ВЫВЕСТИ (МИН. 10 000 💎)</button>

        <!-- Блок заданий -->
        <div class="section-box">
            <div class="section-header">Задания за рекламу</div>
            
            <div class="task-item">
                <div class="task-info">
                    <div>Подписка на Telegram канал</div>
                    <div>+500 💎</div>
                </div>
                <button id="task-1" class="task-go-btn" onclick="doTask(1, 'https://t.me')">Выполнить</button>
            </div>

            <div class="task-item">
                <div class="task-info">
                    <div>Посетить сайт партнера</div>
                    <div>+300 💎</div>
                </div>
                <button id="task-2" class="task-go-btn" onclick="doTask(2, 'https://google.com')">Выполнить</button>
            </div>
        </div>

    </div>

    <script>
        // Инициализация AdsGram SDK
        const AdController = window.Adsgram.init({ blockId: "29401" });

        // Данные из localStorage
        let balance = Number(localStorage.getItem('ruby_balance')) || 0;
        let clicksBeforeAd = Number(localStorage.getItem('ruby_clicks')) || 0;
        const CLICK_TARGET = 30; // Реклама каждые 30 кликов

        let tasksDone = {
            1: localStorage.getItem('task_1_done') === 'true',
            2: localStorage.getItem('task_2_done') === 'true'
        };

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            
            // Расчет эквивалента в USD (1 рубин = 0.0001$)
            let usdValue = (balance * 0.0001).toFixed(4);
            document.getElementById('usd-eq').innerText = `≈ $${usdValue}`;

            // Прогресс бар до рекламы
            let remaining = CLICK_TARGET - (clicksBeforeAd % CLICK_TARGET);
            let percent = ((clicksBeforeAd % CLICK_TARGET) / CLICK_TARGET) * 100;
            document.getElementById('ad-progress').style.width = percent + '%';
            document.getElementById('click-status').innerText = `До рекламы: ${remaining} клик.`;

            // Кнопка вывода (доступна от 10 000 рубинов)
            const withdrawBtn = document.getElementById('withdraw-btn');
            if (balance >= 10000) {
                withdrawBtn.disabled = false;
                withdrawBtn.innerText = "ВЫВЕСТИ СРЕДСТВА ($1.00)";
            } else {
                withdrawBtn.disabled = true;
                withdrawBtn.innerText = `ВЫВЕСТИ (ЕЩЕ ${ (10000 - balance).toLocaleString() } 💎)`;
            }

            // Статус заданий
            for (let id in tasksDone) {
                const btn = document.getElementById(`task-${id}`);
                if (tasksDone[id]) {
                    btn.innerText = "Выполнено";
                    btn.classList.add("done");
                    btn.disabled = true;
                }
            }
        }

        // Клик по рубину
        function tapRuby() {
            balance += 1;
            clicksBeforeAd += 1;

            localStorage.setItem('ruby_balance', balance);
            localStorage.setItem('ruby_clicks', clicksBeforeAd);

            // Вибрация на телефоне при тапе
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }

            updateUI();

            // Проверяем, наступил ли момент показа рекламы каждые 30 кликов
            if (clicksBeforeAd % CLICK_TARGET === 0) {
                showMandatoryAd();
            }
        }

        // Принудительный показ рекламы каждые 30 кликов
        function showMandatoryAd() {
            const status = document.getElementById('status');
            status.innerText = "⚡ Загрузка обязательной рекламы за майнинг...";

            AdController.show().then((result) => {
                if (result.done) {
                    status.innerText = "✅ Реклама просмотрена! Майним дальше.";
                } else {
                    status.innerText = "⚠️ Реклама была закрыта до конца.";
                }
            }).catch((err) => {
                console.error(err);
                status.innerText = "❌ Ошибка загрузки рекламы.";
            });
        }

        // Выполнение заданий (сначала просмотр 1 рекламы, потом открытие ссылки)
        function doTask(taskId, url) {
            if (tasksDone[taskId]) return;

            const status = document.getElementById('status');
            status.innerText = "📺 Загрузка рекламы для выполнения задания...";

            AdController.show().then((result) => {
                if (result.done) {
                    // Награда за задание
                    const reward = taskId === 1 ? 500 : 300;
                    balance += reward;
                    tasksDone[taskId] = true;

                    localStorage.setItem('ruby_balance', balance);
                    localStorage.setItem(`task_${taskId}_done`, 'true');

                    updateUI();
                    status.innerText = `🎉 Задание выполнено! +${reward} 💎`;

                    // Открываем ссылку задания
                    window.open(url, '_blank');
                } else {
                    status.innerText = "⚠️ Вы закрыли рекламу, награда не получена.";
                }
            }).catch((err) => {
                console.error(err);
                status.innerText = "❌ Ошибка показа рекламы для задания.";
            });
        }

        // Логика вывода (нужно посмотреть 3 рекламы подряд)
        let adsWatchedForWithdraw = 0;

        function openWithdrawModal() {
            if (balance < 10000) return;

            const status = document.getElementById('status');
            adsWatchedForWithdraw = 0;
            
            status.innerText = `🛡️ Защита вывода: просмотрите рекламный ролик (1/3)...`;
            runWithdrawAdFlow();
        }

        function runWithdrawAdFlow() {
            AdController.show().then((result) => {
                if (result.done) {
                    adsWatchedForWithdraw++;
                    if (adsWatchedForWithdraw < 3) {
                        document.getElementById('status').innerText = `🛡️ Проверено! Ролик ${adsWatchedForWithdraw}/3. Смотрим следующий...`;
                        runWithdrawAdFlow(); // показываем следующий из 3
                    } else {
                        // Все 3 рекламы просмотрены! Списываем баланс и оформляем вывод
                        balance -= 10000;
                        localStorage.setItem('ruby_balance', balance);
                        updateUI();
                        document.getElementById('status').innerText = "🚀 Заявка на вывод $1.00 успешно создана! Ожидайте выплату.";
                        alert("Заявка успешно отправлена администратору!");
                    }
                } else {
                    document.getElementById('status').innerText = "❌ Вывод отменен: нужно досмотреть все 3 рекламы.";
                }
            }).catch((err) => {
                console.error(err);
                document.getElementById('status').innerText = "❌ Ошибка при проверке вывода.";
            });
        }

        // Запуск при старте
        updateUI();
    </script>
</body>
</html>
