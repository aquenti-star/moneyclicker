<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ruby Miner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #08080a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .balance-card {
            background: linear-gradient(135deg, #141013 0%, #1c0c10 100%);
            border: 1px solid rgba(255, 30, 66, 0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(255, 30, 66, 0.08);
        }

        .card-title {
            font-size: 11px;
            color: #a0888c;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .balance-val {
            font-size: 34px;
            font-weight: 800;
            color: #ff2a4d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 15px rgba(255, 42, 77, 0.3);
        }

        .ruble-eq {
            font-size: 12px;
            color: #706065;
            margin-top: 4px;
            font-weight: 600;
        }

        .miner-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
        }

        .ruby-btn {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #2a080f 0%, #120407 100%);
            border-radius: 50%;
            border: 4px solid rgba(255, 42, 77, 0.3);
            box-shadow: 0 0 40px rgba(255, 42, 77, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .ruby-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(255, 42, 77, 0.5);
        }

        .progress-container {
            width: 100%;
            background: #161214;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ff2a4d);
            width: 0%;
            transition: width 0.2s ease;
        }

        .click-counter-text {
            font-size: 11px;
            color: #887075;
            margin-top: 6px;
            font-weight: 600;
            text-align: center;
        }

        .withdraw-btn {
            background: linear-gradient(135deg, #cc0029 0%, #ff2a4d 100%);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 77, 0.3);
            transition: 0.2s;
            text-align: center;
        }

        .withdraw-btn:disabled {
            background: #1c1416;
            color: #554448;
            box-shadow: none;
            cursor: not-allowed;
        }

        .section-box {
            background: #120e11;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
        }

        .section-header {
            font-size: 12px;
            font-weight: 700;
            color: #c0a8ad;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1317;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 30, 66, 0.1);
        }

        .task-info div:first-child {
            font-size: 12px;
            font-weight: 700;
        }

        .task-info div:last-child {
            font-size: 10px;
            color: #ff2a4d;
            font-weight: 600;
            margin-top: 2px;
        }

        .task-go-btn {
            background: #ff2a4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .status-text {
            font-size: 11px;
            font-weight: 600;
            color: #706065;
            text-align: center;
            min-height: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="balance-card">
            <div class="card-title">Баланс рубинов</div>
            <div class="balance-val">
                <span>💎</span>
                <span id="balance">0</span>
            </div>
            <div class="ruble-eq" id="usd-eq">≈ $0.0000</div>
        </div>

        <div class="miner-area">
            <div class="ruby-btn" onclick="tapRuby()">
                <!-- SVG Рубин высокого качества -->
                <svg viewBox="0 0 100 100" width="100" height="100">
                    <defs>
                        <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff2a4d" />
                            <stop offset="50%" stop-color="#cc0029" />
                            <stop offset="100%" stop-color="#5a0010" />
                        </linearGradient>
                        <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ff6b8b" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="#ff2a4d" stop-opacity="0.2"/>
                        </linearGradient>
                    </defs>
                    <polygon points="30,15 70,15 90,40 50,90 10,40" fill="url(#rubyGrad)" stroke="#ff6b8b" stroke-width="1.5"/>
                    <polygon points="30,15 70,15 50,40" fill="url(#facetTop)"/>
                    <polygon points="30,15 10,40 50,40" fill="#a80020" opacity="0.6"/>
                    <polygon points="70,15 90,40 50,40" fill="#e60032" opacity="0.7"/>
                    <polygon points="10,40 50,90 50,40" fill="#800015" opacity="0.8"/>
                    <polygon points="90,40 50,90 50,40" fill="#b30024" opacity="0.7"/>
                </svg>
            </div>
            <div style="width: 100%;">
                <div class="progress-container">
                    <div id="ad-progress" class="progress-bar"></div>
                </div>
                <div id="click-status" class="click-counter-text">До рекламы: 30 / 30</div>
            </div>
        </div>

        <div id="status" class="status-text">Готов к майнингу</div>

        <button id="withdraw-btn" class="withdraw-btn" onclick="requestWithdraw()" disabled>ВЫВЕСТИ (МИН. 10 000 💎)</button>

        <div class="section-box">
            <div class="section-header">Задания за рекламу</div>
            
            <div class="task-item">
                <div class="task-info">
                    <div>Подписка на канал (+10 💎)</div>
                    <div>Просмотр рекламы + подписка</div>
                </div>
                <button id="task-sub" class="task-go-btn" onclick="doSubTask()">Выполнить</button>
            </div>

            <div class="task-item">
                <div class="task-info">
                    <div>Посмотреть 10 реклам (+100 💎)</div>
                    <div id="ads-counter">Прогресс: 0 / 10</div>
                </div>
                <button id="task-ads" class="task-go-btn" onclick="doAdsTask()">Смотреть</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const AdController = window.Adsgram.init({ blockId: "29401" });

        let balance = Number(localStorage.getItem('ruby_balance')) || 0;
        let clicksBeforeAd = Number(localStorage.getItem('ruby_clicks')) || 0;
        let adsWatchedCount = Number(localStorage.getItem('ads_watched_count')) || 0;
        const CLICK_TARGET = 30;

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            let usdValue = (balance * 0.0001).toFixed(4);
            document.getElementById('usd-eq').innerText = `≈ $${usdValue}`;

            let remaining = CLICK_TARGET - (clicksBeforeAd % CLICK_TARGET);
            let percent = ((clicksBeforeAd % CLICK_TARGET) / CLICK_TARGET) * 100;
            document.getElementById('ad-progress').style.width = percent + '%';
            document.getElementById('click-status').innerText = `До рекламы: ${remaining} клик.`;

            const withdrawBtn = document.getElementById('withdraw-btn');
            if (balance >= 10000) {
                withdrawBtn.disabled = false;
                withdrawBtn.innerText = "ВЫВЕСТИ СРЕДСТВА ($1.00)";
            } else {
                withdrawBtn.disabled = true;
                withdrawBtn.innerText = `ВЫВЕСТИ (ЕЩЕ ${ (10000 - balance).toLocaleString() } 💎)`;
            }

            document.getElementById('ads-counter').innerText = `Прогресс: ${adsWatchedCount} / 10`;
        }

        function tapRuby() {
            balance += 1;
            clicksBeforeAd += 1;

            localStorage.setItem('ruby_balance', balance);
            localStorage.setItem('ruby_clicks', clicksBeforeAd);

            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }

            updateUI();

            if (clicksBeforeAd % CLICK_TARGET === 0) {
                showMandatoryAd();
            }
        }

        function showMandatoryAd() {
            const status = document.getElementById('status');
            status.innerText = "⚡ Загрузка рекламы за майнинг...";

            AdController.show().then((result) => {
                if (result.done) {
                    status.innerText = "✅ Реклама просмотрена! +1 рубин бонус.";
                    balance += 1;
                    updateUI();
                } else {
                    status.innerText = "⚠️ Реклама закрыта до конца.";
                }
            }).catch((err) => {
                status.innerText = "❌ Ошибка загрузки рекламы.";
            });
        }

        // Задание с подпиской (+10 рубинов)
        function doSubTask() {
            const status = document.getElementById('status');
            status.innerText = "📺 Загрузка рекламы для подписки...";

            AdController.show().then((result) => {
                if (result.done) {
                    status.innerText = "✅ Переход в канал. Подпишитесь и проверьте в боте!";
                    window.open('https://t.me/tvo_kanal_username', '_blank');
                    // Начисляем бонус
                    balance += 10;
                    localStorage.setItem('ruby_balance', balance);
                    updateUI();
                } else {
                    status.innerText = "⚠️ Реклама закрыта.";
                }
            }).catch((err) => {
                status.innerText = "❌ Ошибка рекламы.";
            });
        }

        // Задание: посмотреть 10 реклам (+100 рубинов)
        function doAdsTask() {
            if (adsWatchedCount >= 10) return;
            const status = document.getElementById('status');
            status.innerText = `📺 Просмотр ролика (${adsWatchedCount + 1}/10)...`;

            AdController.show().then((result) => {
                if (result.done) {
                    adsWatchedCount++;
                    localStorage.setItem('ads_watched_count', adsWatchedCount);
                    updateUI();

                    if (adsWatchedCount >= 10) {
                        balance += 100;
                        localStorage.setItem('ruby_balance', balance);
                        updateUI();
                        status.innerText = "🎉 Задание выполнено! Получено +100 💎";
                    } else {
                        status.innerText = `✅ Отлично! Осталось посмотреть ${10 - adsWatchedCount} ролик(ов).`;
                    }
                } else {
                    status.innerText = "⚠️ Ролик не был досмотрен.";
                }
            }).catch((err) => {
                status.innerText = "❌ Ошибка показа рекламы.";
            });
        }

        // Вывод через бота
        function requestWithdraw() {
            if (balance < 10000) return;
            let wallet = prompt("Введите ваш TON кошелек или данные CryptoBot для получения $1.00:");
            if (!wallet) return;

            // Перенаправляем пользователя в бота с командой /withdraw кошелек
            window.location.href = `https://t.me/rubyminerwithdraw_bot?start=withdraw_${wallet}`;
        }

        updateUI();
    </script>
</body>
</html>
